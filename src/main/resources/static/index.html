<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 및 결제</title>
    <script src="https://cdn.iamport.kr/js/iamport.payment-1.2.0.js"></script> <!-- 아임포트 결제 모듈 추가 -->
</head>
<body>
<h2>차량 및 주차 예약</h2>

<form id="reservationForm">
    <label for="carId">Car ID:</label>
    <input type="text" id="carId" name="carId" required><br><br>

    <label for="parkingSpotId">Parking Spot ID:</label>
    <input type="text" id="parkingSpotId" name="parkingSpotId" required><br><br>

    <label for="parkingInfoId">Parking Info ID:</label>
    <input type="text" id="parkingInfoId" name="parkingInfoId"><br><br>

    <button type="button" onclick="makeReservation()">예약</button>
</form>

<div id="depositSection" style="display: none;">
    <h2>보증금 결제</h2>
    <button type="button" onclick="makeDeposit()">보증금 결제하기</button>
</div>

<div id="result"></div> <!-- 결과를 표시할 영역 -->

<script>
    let reservationId;

    function makeReservation() {
        const carId = document.getElementById("carId").value;
        const parkingSpotId = document.getElementById("parkingSpotId").value;
        const parkingInfoId = document.getElementById("parkingInfoId").value;

        fetch('/reservation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                carsId: carId,
                parkingSpotId: parkingSpotId,
                parkingInfoId: parkingInfoId
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.reservationId) { // 예약 성공
                    reservationId = data.reservationId;
                    document.getElementById("result").innerText = "예약이 성공적으로 완료되었습니다!";
                    document.getElementById("depositSection").style.display = 'block';
                } else {
                    document.getElementById("result").innerText = "예약 실패: " + data.message;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("result").innerText = "예약 처리 중 오류가 발생했습니다.";
            });
    }

    function makeDeposit() {
        const IMP = window.IMP;
        IMP.init('imp34307077'); // 아임포트 '가맹점 식별코드'로 변경해야 합니다.

        IMP.request_pay({
            pg: "html5_inicis",
            pay_method: "card",
            merchant_uid: "merchant_" + new Date().getTime(),
            name: "주차 예약 보증금 결제",
            amount: 100,
            buyer_email: "test@example.com",
            buyer_name: "홍길동",
            buyer_tel: "010-1234-5678"
        }, function (rsp) {
            if (rsp.success) {
                fetch('/reservation/deposit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        reservationId: reservationId,
                        importId: rsp.imp_uid
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            document.getElementById("result").innerText = "보증금 결제가 성공적으로 처리되었습니다!";
                        } else {
                            document.getElementById("result").innerText = "보증금 결제 실패: " + data.message;
                        }
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        document.getElementById("result").innerText = "보증금 결제 처리 중 오류가 발생했습니다.";
                    });
            } else {
                document.getElementById("result").innerText = "보증금 결제 실패: " + rsp.error_msg;
            }
        });
    }
</script>
</body>
</html>
