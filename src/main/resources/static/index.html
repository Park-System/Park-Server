<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 및 결제</title>
    <script src="https://cdn.iamport.kr/js/iamport.payment-1.2.0.js"></script> <!-- 아임포트 결제 모듈 추가 -->
</head>
<body>
<h2>차량 및 주차 예약</h2>

<form id="reservationForm">
    <label for="carId">Car ID:</label>
    <input type="text" id="carId" name="carId" required><br><br>

    <label for="parkingSpotId">Parking Spot ID:</label>
    <input type="text" id="parkingSpotId" name="parkingSpotId" required><br><br>

    <button type="button" onclick="makeReservation()">예약 및 결제</button>
</form>

<div id="result"></div> <!-- 결과를 표시할 영역 -->

<script>
    function makeReservation() {
        const carId = document.getElementById("carId").value;
        const parkingSpotId = document.getElementById("parkingSpotId").value;

        // 아임포트 초기화
        const IMP = window.IMP;
        IMP.init('imp34307077'); // 아임포트 '가맹점 식별코드'로 변경해야 합니다.

        IMP.request_pay({
            pg: "html5_inicis", // 사용할 PG사
            pay_method: "card", // 결제 수단
            merchant_uid: "merchant_" + new Date().getTime(), // 주문 번호
            name: "주차 예약 결제", // 결제 명칭
            amount: 100, // 결제 금액 (원화)
            buyer_email: "test@example.com",
            buyer_name: "홍길동",
            buyer_tel: "010-1234-5678"
        }, function (rsp) { // 콜백 함수
            if (rsp.success) {
                // 결제가 완료된 경우 서버에 예약 및 결제 정보를 전달
                fetch('/reservation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        carsId: carId,
                        parkingSpotId: parkingSpotId,
                        importId: rsp.imp_uid // Iamport에서 반환한 결제 ID
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            document.getElementById("result").innerText = "예약 및 결제가 성공적으로 처리되었습니다!";
                        } else {
                            document.getElementById("result").innerText = "결제 실패: " + data.message;
                        }
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        document.getElementById("result").innerText = "요청 처리 중 오류가 발생했습니다.";
                    });
            } else {
                // 결제 실패 시
                document.getElementById("result").innerText = "결제 실패: " + rsp.error_msg;
            }
        });
    }
</script>
</body>
</html>
