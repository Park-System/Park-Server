name: Java CI with Gradle

on:
  pull_request:
    branches: [ "*" ]  # PR이 열리거나 업데이트될 때 CI 실행

  push:
    branches:
      - develop 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        token: ${{ secrets.MY_TOKEN }}
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Start Redis container
    - name: Start Redis
      uses: supercharge/redis-github-action@1.1.0
      with:
        redis-version: 6

    - name: Set up secret yml file
      env:
        YAML_SECRET: ${{ secrets.YAML_SECRET }}
        YAML_DIR: src/main/resources
        YAML_TEST_DIR: src/test/resources
        YAML_FILE_NAME: application-secret.yml
      run: |
        echo $YAML_SECRET | base64 --decode > $YAML_DIR/$YAML_FILE_NAME
        echo $YAML_SECRET | base64 --decode > $YAML_TEST_DIR/$YAML_FILE_NAME
        echo "YAML_SECRET has been decoded and saved to $YAML_DIR/$YAML_FILE_NAME"
        echo "YAML_SECRET has been decoded and saved to $YAML_TEST_DIR/$YAML_FILE_NAME"

    # Wait for Redis to start (Optional but recommended)
    - name: Wait for Redis to be ready
      run: sleep 10  # 10초 정도 대기 (Redis가 시작될 시간을 고려)

    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew
      
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: |
        ./gradlew test    # 테스트를 명시적으로 실행
        ./gradlew build   # 빌드

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'  # develop 브랜치로 푸시된 경우에만 실행

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        token: ${{ secrets.MY_TOKEN }}

    # Docker 빌드 및 푸시
    - name: Docker build and push
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-cicd:$GITHUB_SHA .
        docker push ${{ secrets.DOCKER_USERNAME }}/spring-cicd:$GITHUB_SHA

    # EC2에 배포: SSH를 통해 EC2 서버에서 Docker 실행
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ec2-user
        key: ${{ secrets.PRIVATE_KEY }}
        envs: GITHUB_SHA
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/spring-cicd:$GITHUB_SHA
          docker tag ${{ secrets.DOCKER_USERNAME }}/spring-cicd:$GITHUB_SHA spring-cicd
          docker stop server || true  # 서버가 실행 중이면 종료
          docker run -d --rm --name server -p 80:8080 spring-cicd
